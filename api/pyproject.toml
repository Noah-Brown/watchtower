[project]
name = "tower-api"
version = "0.1.0"
description = "Control Tower API — event ingestion, persistence, fan-out"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[tool.uv]
package = false
